name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Builds with no environment variables on purpose: the platform is
      # supposed to run with zero keys, so a build that only succeeds when
      # secrets are present is a regression in that guarantee.
      - name: Build
        run: npm run build
